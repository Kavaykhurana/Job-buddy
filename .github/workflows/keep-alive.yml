name: Keep alive

# Supabase pauses free projects after a week without activity, and the server cannot start while its project is paused.
# A daily request wakes the Render service; /api/v1/health then runs a small Supabase query.
# A failed run (GitHub emails the repo owner) means the data store is unreachable: restore the project in Supabase.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live service
        run: curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 https://job-buddy-hs1e.onrender.com/api/v1/health
