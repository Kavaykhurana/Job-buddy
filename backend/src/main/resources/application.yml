server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: sih-connect-api
  main:
    banner-mode: "off"
  # The in-memory migration slice is self-contained until the PostgreSQL
  # repositories and Flyway migrations are added. Production must use the
  # `postgres` profile before Render is switched to Java.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt-secret: ${APP_JWT_SECRET:}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
