server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: job-buddy-api
  main:
    banner-mode: "off"
  # The in-memory migration slice is self-contained until the PostgreSQL
  # repositories and Flyway migrations are added. Production must use the
  # `postgres` profile before Render is switched to Java.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
  data:
    jpa:
      repositories:
        enabled: false
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt-secret: ${APP_JWT_SECRET:}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
