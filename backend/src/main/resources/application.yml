server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: sih-connect-api
  main:
    banner-mode: "off"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt-secret: ${APP_JWT_SECRET:}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
