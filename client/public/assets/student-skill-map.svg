<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" fill="none">
  <rect width="600" height="350" rx="16" fill="#f5f4ee"/>
  <defs>
    <linearGradient id="gradOlive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#415642" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2f4132" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gradOchre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b77a20" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e09b3d" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="gradWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eee4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dfe8db" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Background grid pattern -->
  <g opacity="0.35" stroke="#dfe1d8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="50" y1="0" x2="50" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
    <line x1="450" y1="0" x2="450" y2="350"/>
    <line x1="550" y1="0" x2="550" y2="350"/>
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
  </g>

  <!-- Skill Radar / Convex Polygon -->
  <polygon points="300,60 480,140 430,280 170,280 120,140" fill="url(#gradWash)" stroke="#415642" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>
  <polygon points="300,90 440,150 400,250 200,250 160,150" fill="#415642" fill-opacity="0.15" stroke="#415642" stroke-width="2"/>
  <polygon points="300,120 390,165 370,230 230,230 210,165" fill="url(#gradOchre)" fill-opacity="0.25" stroke="#b77a20" stroke-width="2"/>

  <!-- Axis lines -->
  <line x1="300" y1="190" x2="300" y2="60" stroke="#415642" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="480" y2="140" stroke="#415642" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="430" y2="280" stroke="#415642" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="170" y2="280" stroke="#415642" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="120" y2="140" stroke="#415642" stroke-width="1.5"/>

  <!-- Center Hub -->
  <circle cx="300" cy="190" r="8" fill="#415642"/>
  <circle cx="300" cy="190" r="14" stroke="#415642" stroke-width="1.5" opacity="0.5"/>

  <!-- Skill Nodes -->
  <!-- Top: Python / Programming -->
  <g transform="translate(300, 60)">
    <circle r="14" fill="#ffffff" stroke="#415642" stroke-width="2"/>
    <circle r="6" fill="#415642"/>
    <rect x="-45" y="-34" width="90" height="20" rx="6" fill="#415642"/>
    <text x="0" y="-20" fill="#ffffff" font-family="Manrope, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PYTHON 92%</text>
  </g>

  <!-- Top-Right: Data Analysis -->
  <g transform="translate(480, 140)">
    <circle r="12" fill="#ffffff" stroke="#415642" stroke-width="2"/>
    <circle r="5" fill="#415642"/>
    <rect x="18" y="-10" width="84" height="20" rx="6" fill="#415642"/>
    <text x="60" y="4" fill="#ffffff" font-family="Manrope, sans-serif" font-size="10" font-weight="700" text-anchor="middle">DATA 86%</text>
  </g>

  <!-- Bottom-Right: SQL & DB -->
  <g transform="translate(430, 280)">
    <circle r="12" fill="#ffffff" stroke="#b77a20" stroke-width="2"/>
    <circle r="5" fill="#b77a20"/>
    <rect x="18" y="-5" width="80" height="20" rx="6" fill="#b77a20"/>
    <text x="58" y="9" fill="#ffffff" font-family="Manrope, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SQL 68%</text>
  </g>

  <!-- Bottom-Left: Research & Writing -->
  <g transform="translate(170, 280)">
    <circle r="12" fill="#ffffff" stroke="#415642" stroke-width="2"/>
    <circle r="5" fill="#415642"/>
    <rect x="-96" y="-5" width="80" height="20" rx="6" fill="#415642"/>
    <text x="-56" y="9" fill="#ffffff" font-family="Manrope, sans-serif" font-size="10" font-weight="700" text-anchor="middle">RESEARCH</text>
  </g>

  <!-- Top-Left: Communication -->
  <g transform="translate(120, 140)">
    <circle r="12" fill="#ffffff" stroke="#415642" stroke-width="2"/>
    <circle r="5" fill="#415642"/>
    <rect x="-105" y="-10" width="90" height="20" rx="6" fill="#415642"/>
    <text x="-60" y="4" fill="#ffffff" font-family="Manrope, sans-serif" font-size="10" font-weight="700" text-anchor="middle">COMM 84%</text>
  </g>
</svg>
