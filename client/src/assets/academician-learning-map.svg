<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" fill="none">
  <rect width="600" height="350" rx="16" fill="#f5f4ee"/>

  <!-- Flow / Process Nodes: Curriculum -> Skill Mapping -> Learning Outcome -->
  <!-- Connector path -->
  <path d="M120 175 C 200 100, 260 100, 320 175 C 380 250, 440 250, 480 175" fill="none" stroke="#415642" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Block 1: Academic Curriculum -->
  <g transform="translate(70, 130)">
    <rect width="100" height="90" rx="12" fill="#ffffff" stroke="#415642" stroke-width="2" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.06))"/>
    <circle cx="50" cy="30" r="14" fill="#e8eee4"/>
    <path d="M44 30L56 30M50 24L50 36" stroke="#415642" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="62" fill="#252824" font-family="Manrope, sans-serif" font-size="10" font-weight="800" text-anchor="middle">CURRICULUM</text>
    <text x="50" y="74" fill="#68706a" font-family="Manrope, sans-serif" font-size="8" font-weight="600" text-anchor="middle">4 Core Modules</text>
  </g>

  <!-- Block 2: Industry Alignment Center Hub -->
  <g transform="translate(260, 120)">
    <rect width="120" height="110" rx="14" fill="#415642" filter="drop-shadow(0px 6px 12px rgba(65,86,66,0.2))"/>
    <circle cx="60" cy="38" r="16" fill="#ffffff" fill-opacity="0.2"/>
    <circle cx="60" cy="38" r="7" fill="#ffffff"/>
    <text x="60" y="76" fill="#ffffff" font-family="Manrope, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ALIGNMENT</text>
    <text x="60" y="92" fill="#e8eee4" font-family="Manrope, sans-serif" font-size="9" font-weight="600" text-anchor="middle">82% Match</text>
  </g>

  <!-- Block 3: Industry Outcome -->
  <g transform="translate(430, 130)">
    <rect width="100" height="90" rx="12" fill="#ffffff" stroke="#b77a20" stroke-width="2" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.06))"/>
    <circle cx="50" cy="30" r="14" fill="#f7ecda"/>
    <circle cx="50" cy="30" r="6" fill="#b77a20"/>
    <text x="50" y="62" fill="#252824" font-family="Manrope, sans-serif" font-size="10" font-weight="800" text-anchor="middle">OUTCOMES</text>
    <text x="50" y="74" fill="#b77a20" font-family="Manrope, sans-serif" font-size="8" font-weight="700" text-anchor="middle">FDP &amp; Training</text>
  </g>
</svg>
